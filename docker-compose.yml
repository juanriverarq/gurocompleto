
services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guro-php
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: guro
      DB_USERNAME: guro
      DB_PASSWORD: secret
    command: ["bash", "-lc", "chmod +x docker/start.sh && docker/start.sh"]
    depends_on:
      - db
    networks:
      - guro

  nginx:
    image: nginx:1.25-alpine
    container_name: guro-nginx
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./deploy/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - guro

  db:
    image: mysql:8.0
    container_name: guro-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: guro
      MYSQL_USER: guro
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - guro

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: guro-phpmyadmin
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - guro

volumes:
  mysql_data:

networks:
  guro:


